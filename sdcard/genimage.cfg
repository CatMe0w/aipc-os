image boot.vfat {
    vfat {
        label = "AIPCBOOT"
        extraargs = "-F 32 -h 2048"
        files = {
            "BOOT.BIN",
            "zImage",
            "gdbstub.bin",
            "haret.exe",
            "startup.txt",
        }
    }

    size = 128M
}

image rootfs.ext4 {
    ext4 {
        use-mke2fs = true
        label = "aipc-root"
        extraargs = "-m 1"
        features = "^64bit,^metadata_csum_seed,^orphan_file"
    }

    size = 3G
    mountpoint = "/"
}

image aipc-os-sdcard.img {
    hdimage {
        partition-table-type = "mbr"
        align = 1M
        disk-signature = 0x41495043
    }

    partition boot {
        bootable = true
        partition-type = 0x0c
        offset = 1M
        size = 128M
        image = "boot.vfat"
    }

    partition rootfs {
        partition-type = 0x83
        size = 3G
        image = "rootfs.ext4"
    }
}
